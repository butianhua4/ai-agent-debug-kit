name: Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run preflight
        run: npm run preflight

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: ai-agent-debug-kit
          path: dist/ai-agent-debug-kit.zip
          if-no-files-found: error
