<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">299 AI 自动化诊断敏感信息禁止发送卡</title>
  <desc id="desc">提醒买家不要发送账号密码、验证码、密钥、银行卡、身份证原件和后台完整权限。</desc>
  <defs>
    <style>
      .font { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
      .title { font-size: 58px; font-weight: 800; letter-spacing: 0; }
      .subtitle { font-size: 30px; font-weight: 700; letter-spacing: 0; }
      .head { font-size: 38px; font-weight: 800; letter-spacing: 0; }
      .item { font-size: 32px; font-weight: 700; letter-spacing: 0; }
      .small { font-size: 26px; font-weight: 700; letter-spacing: 0; }
      .white { fill: #ffffff; }
      .ink { fill: #111827; }
      .muted { fill: #64748b; }
    </style>
  </defs>
  <rect width="1080" height="1080" fill="#f8fafc"/>
  <rect x="54" y="54" width="972" height="972" rx="42" fill="#ffffff" stroke="#d7dee8" stroke-width="2"/>
  <rect x="54" y="54" width="972" height="226" rx="42" fill="#7f1d1d"/>
  <rect x="54" y="212" width="972" height="68" fill="#991b1b"/>
  <text x="102" y="134" class="font title white">这些信息不要发</text>
  <text x="102" y="194" class="font subtitle white">保护账号安全：先脱敏，再诊断</text>
  <rect x="790" y="92" width="178" height="96" rx="24" fill="#ffffff" opacity="0.14"/>
  <text x="824" y="150" class="font head white">安全边界</text>

  <rect x="88" y="330" width="424" height="500" rx="32" fill="#fef2f2" stroke="#fecaca" stroke-width="3"/>
  <rect x="568" y="330" width="424" height="500" rx="32" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="3"/>
  <circle cx="136" cy="385" r="24" fill="#dc2626"/>
  <path d="M124 373 L148 397 M148 373 L124 397" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <text x="178" y="398" class="font head ink">不要发</text>
  <circle cx="616" cy="385" r="24" fill="#16a34a"/>
  <path d="M604 386 L613 396 L631 373" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="658" y="398" class="font head ink">可以发</text>

  <text x="126" y="476" class="font item ink">账号密码</text>
  <text x="126" y="548" class="font item ink">验证码 / 二维码</text>
  <text x="126" y="620" class="font item ink">API Key / Token</text>
  <text x="126" y="692" class="font item ink">银行卡 / 身份证原件</text>
  <text x="126" y="764" class="font item ink">后台完整权限</text>

  <text x="606" y="476" class="font item ink">错误截图</text>
  <text x="606" y="548" class="font item ink">脱敏日志</text>
  <text x="606" y="620" class="font item ink">流程截图</text>
  <text x="606" y="692" class="font item ink">目标结果</text>
  <text x="606" y="764" class="font item ink">复现步骤</text>

  <rect x="98" y="878" width="884" height="76" rx="22" fill="#111827"/>
  <text x="146" y="926" class="font small white">如果必须看配置，请先打码敏感字段</text>
  <text x="98" y="1018" class="font small muted">AI Build Flow · 平台内沟通 · 不接收敏感隐私</text>
