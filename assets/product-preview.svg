  <text x="1104" y="426" font-family="Inter, Arial, sans-serif" font-size="13" fill="#657067">1 call</text>
  <text x="934" y="458" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#17201b">apply_patch</text>
  <text x="1104" y="458" font-family="Inter, Arial, sans-serif" font-size="13" fill="#657067">1 call</text>

  <rect x="606" y="516" width="574" height="104" rx="10" fill="#ffffff" stroke="#d9ded6"/>
  <text x="630" y="552" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#17201b">Recommendation</text>
  <text x="630" y="586" font-family="Inter, Arial, sans-serif" font-size="14" fill="#657067">Start with the first failing tool result; later failures may be downstream noise.</text>
