  <text x="118" y="356" font-family="Consolas, monospace" font-size="14" fill="#a15c00">{"level":"warn","tool":"shell.exec"}</text>
  <text x="118" y="386" font-family="Consolas, monospace" font-size="14" fill="#b42318">{"level":"error","message":"tests failed"}</text>
  <text x="118" y="416" font-family="Consolas, monospace" font-size="14" fill="#657067">{"tool":"apply_patch","files":["parser.ts"]}</text>
