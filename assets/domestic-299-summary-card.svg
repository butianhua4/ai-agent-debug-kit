<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">299 自动化故障诊断总结卡</title>
  <desc id="desc">一屏说明 299 入门诊断适合的问题、买家需要发送的材料、交付内容和不包含范围。</desc>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <style>
      .font { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
      .title { font-size: 56px; font-weight: 800; letter-spacing: 0; }
      .subtitle { font-size: 30px; font-weight: 700; letter-spacing: 0; }
      .head { font-size: 33px; font-weight: 800; letter-spacing: 0; }
      .body { font-size: 27px; font-weight: 600; letter-spacing: 0; }
      .small { font-size: 24px; font-weight: 700; letter-spacing: 0; }
      .white { fill: #fff; }
      .ink { fill: #111827; }
      .muted { fill: #64748b; }
    </style>
  </defs>
  <rect width="1080" height="1080" fill="#f6f8fb"/>
  <rect x="54" y="54" width="972" height="972" rx="42" fill="#ffffff" stroke="#d7dee8" stroke-width="2"/>
  <rect x="54" y="54" width="972" height="244" rx="42" fill="url(#top)"/>
  <text x="102" y="136" class="font title white">299 自动化故障诊断</text>
  <text x="102" y="198" class="font subtitle white">先定位，再决定要不要修</text>
  <rect x="780" y="96" width="174" height="102" rx="28" fill="#ffffff" opacity=".14"/>
  <text x="820" y="158" class="font title white">299</text>
  <text x="806" y="190" class="font small white">入门诊断</text>

  <rect x="92" y="350" width="414" height="146" rx="28" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="128" y="402" class="font head ink">适合这些问题</text>
  <text x="128" y="454" class="font body muted">n8n / Make / Zapier / Agent</text>
  <text x="128" y="488" class="font body muted">Webhook / JSON / API</text>

  <rect x="574" y="350" width="414" height="146" rx="28" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
  <text x="610" y="402" class="font head ink">你需要发送</text>
  <text x="610" y="454" class="font body muted">错误截图、流程截图、脱敏日志</text>
  <text x="610" y="488" class="font body muted">目标结果、复现步骤</text>

  <rect x="92" y="548" width="896" height="152" rx="28" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
  <text x="128" y="604" class="font head ink">你会收到</text>
  <text x="128" y="656" class="font body muted">一页诊断报告：故障点、可能原因、修复顺序、测试清单</text>

  <rect x="92" y="742" width="896" height="118" rx="28" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
  <text x="128" y="792" class="font head ink">不包含</text>
  <text x="300" y="792" class="font body muted">不登录账号，不收密码密钥，不直接改生产后台</text>
  <text x="128" y="832" class="font small muted">适合先判断问题值不值得继续修</text>

  <rect x="92" y="904" width="896" height="70" rx="22" fill="#111827"/>
  <text x="142" y="949" class="font small white">AI Build Flow · 299 入门诊断 · 安全脱敏交付</text>
</svg>
