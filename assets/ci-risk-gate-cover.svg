<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI Agent CI Risk Gate cover</title>
  <desc id="desc">Fiverr gallery cover for a CI risk gate that checks AI agent logs before merge or deployment.</desc>
  <rect width="1280" height="720" fill="#f6f8fb"/>
  <rect x="70" y="64" width="1140" height="592" rx="28" fill="#ffffff" stroke="#d8dee8" stroke-width="2"/>
  <rect x="70" y="64" width="1140" height="122" rx="28" fill="#101828"/>
  <rect x="70" y="156" width="1140" height="30" fill="#101828"/>
  <text x="120" y="138" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700">AI Agent CI Risk Gate</text>
  <text x="120" y="234" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">Catch risky agent logs before they merge</text>
  <text x="120" y="282" fill="#475467" font-family="Arial, Helvetica, sans-serif" font-size="24">Tool errors, failed JSON parsing, retry loops, and unsafe output patterns.</text>

  <g transform="translate(118 335)">
    <rect width="260" height="178" rx="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
    <text x="28" y="48" fill="#1d4ed8" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">1. Read logs</text>
    <rect x="30" y="76" width="198" height="12" rx="6" fill="#93c5fd"/>
    <rect x="30" y="106" width="156" height="12" rx="6" fill="#bfdbfe"/>
    <rect x="30" y="136" width="208" height="12" rx="6" fill="#93c5fd"/>
  </g>

  <g transform="translate(426 335)">
    <rect width="260" height="178" rx="20" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
    <text x="28" y="48" fill="#c2410c" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">2. Flag risk</text>
    <circle cx="48" cy="92" r="12" fill="#ea580c"/>
    <text x="76" y="101" fill="#475467" font-family="Arial, Helvetica, sans-serif" font-size="20">tool_error</text>
    <circle cx="48" cy="128" r="12" fill="#dc2626"/>
    <text x="76" y="137" fill="#475467" font-family="Arial, Helvetica, sans-serif" font-size="20">retry_loop</text>
  </g>

  <g transform="translate(734 335)">
    <rect width="260" height="178" rx="20" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
    <text x="28" y="48" fill="#047857" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">3. Gate deploy</text>
    <rect x="30" y="78" width="88" height="48" rx="12" fill="#16a34a"/>
    <text x="50" y="111" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">PASS</text>
    <rect x="136" y="78" width="88" height="48" rx="12" fill="#dc2626"/>
    <text x="160" y="111" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">FAIL</text>
  </g>

  <g transform="translate(1042 335)">
    <rect width="120" height="178" rx="20" fill="#eef2ff" stroke="#c7d2fe" stroke-width="2"/>
    <path d="M43 82l17 17 33-43" fill="none" stroke="#4f46e5" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="28" y="140" fill="#3730a3" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Report</text>
  </g>

  <path d="M384 424h34M692 424h34M1000 424h34" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <rect x="120" y="570" width="1040" height="56" rx="28" fill="#101828"/>
  <text x="154" y="607" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">GitHub Actions ready - clear thresholds - redacted reports - no secrets needed</text>
</svg>
