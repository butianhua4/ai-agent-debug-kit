<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">299 AI 自动化诊断下单前材料卡</title>
  <desc id="desc">买家下单前需要准备的错误截图、流程图、日志、目标结果和复现步骤说明。</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="54%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <style>
      .font { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
      .small { font-size: 28px; }
      .body { font-size: 31px; }
      .label { font-size: 24px; font-weight: 700; letter-spacing: 0; }
      .title { font-size: 50px; font-weight: 800; letter-spacing: 0; }
      .subtitle { font-size: 27px; font-weight: 600; letter-spacing: 0; }
      .step { font-size: 34px; font-weight: 800; letter-spacing: 0; }
      .muted { fill: #64748b; }
      .ink { fill: #0f172a; }
      .white { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1080" height="1080" fill="#f6f8fb"/>
  <rect x="54" y="54" width="972" height="972" rx="42" fill="#ffffff" filter="url(#shadow)"/>

  <rect x="54" y="54" width="972" height="226" rx="42" fill="url(#hero)"/>
  <rect x="54" y="224" width="972" height="56" fill="#0f766e"/>
  <text x="102" y="124" class="font title white">下单前请准备这 5 样</text>
  <text x="102" y="188" class="font subtitle white">发材料，不发账号密码；我只看错误和流程</text>
  <rect x="764" y="92" width="206" height="96" rx="24" fill="#ffffff" opacity="0.14"/>
  <text x="792" y="132" class="font label white">299 诊断</text>
  <text x="792" y="168" class="font label white">先定位再修</text>

  <g transform="translate(98 334)">
    <rect x="0" y="0" width="884" height="92" rx="24" fill="#eff6ff" stroke="#bfdbfe"/>
    <circle cx="48" cy="46" r="25" fill="#2563eb"/>
    <text x="39" y="58" class="font label white">1</text>
    <text x="92" y="39" class="font step ink">错误截图</text>
    <text x="292" y="39" class="font body muted">红字、失败步骤、报错弹窗要清楚</text>
  </g>

  <g transform="translate(98 448)">
    <rect x="0" y="0" width="884" height="92" rx="24" fill="#f0fdf4" stroke="#bbf7d0"/>
    <circle cx="48" cy="46" r="25" fill="#16a34a"/>
    <text x="39" y="58" class="font label white">2</text>
    <text x="92" y="39" class="font step ink">流程截图</text>
    <text x="292" y="39" class="font body muted">n8n / Make / Zapier / Agent 节点关系</text>
  </g>

  <g transform="translate(98 562)">
    <rect x="0" y="0" width="884" height="92" rx="24" fill="#fff7ed" stroke="#fed7aa"/>
    <circle cx="48" cy="46" r="25" fill="#f97316"/>
    <text x="39" y="58" class="font label white">3</text>
    <text x="92" y="39" class="font step ink">日志文本</text>
    <text x="292" y="39" class="font body muted">复制失败日志，敏感 token 请先打码</text>
  </g>

  <g transform="translate(98 676)">
    <rect x="0" y="0" width="884" height="92" rx="24" fill="#f5f3ff" stroke="#ddd6fe"/>
    <circle cx="48" cy="46" r="25" fill="#7c3aed"/>
    <text x="39" y="58" class="font label white">4</text>
    <text x="92" y="39" class="font step ink">目标结果</text>
    <text x="292" y="39" class="font body muted">你希望最后自动完成什么动作</text>
  </g>

  <g transform="translate(98 790)">
    <rect x="0" y="0" width="884" height="92" rx="24" fill="#ecfeff" stroke="#a5f3fc"/>
    <circle cx="48" cy="46" r="25" fill="#0891b2"/>
    <text x="39" y="58" class="font label white">5</text>
    <text x="92" y="39" class="font step ink">复现步骤</text>
    <text x="292" y="39" class="font body muted">点哪里会失败，什么时候失败</text>
  </g>

  <rect x="98" y="922" width="884" height="78" rx="22" fill="#111827"/>
  <text x="132" y="970" class="font small white">不要发送：密码、验证码、密钥、银行卡、身份证原件、后台完整权限</text>
  <text x="98" y="1046" class="font label muted">AI Build Flow · AI 自动化故障诊断 · 先脱敏，再诊断</text>
</svg>
