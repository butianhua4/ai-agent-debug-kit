<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Agent Debug Kit</title>
    <meta name="description" content="Debug AI agent logs in one browser tab. Inspect tool calls, errors, warnings, token cost, risk flags, repeated patterns, and export Markdown reports.">
    <meta name="theme-color" content="#2563eb">
    <link rel="canonical" href="https://butianhua4.github.io/ai-agent-debug-kit/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="AI Agent Debug Kit">
    <meta property="og:description" content="A local-first browser and CLI toolkit for turning AI agent logs into readable debug reports.">
    <meta property="og:url" content="https://butianhua4.github.io/ai-agent-debug-kit/">
    <meta property="og:image" content="https://butianhua4.github.io/ai-agent-debug-kit/assets/product-preview.svg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="AI Agent Debug Kit">
    <meta name="twitter:description" content="Inspect AI agent runs, tool calls, cost, risk flags, and export shareable reports.">
    <meta name="twitter:image" content="https://butianhua4.github.io/ai-agent-debug-kit/assets/product-preview.svg">
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "AI Agent Debug Kit",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "Any",
        "description": "A local-first browser and CLI toolkit for turning AI agent logs into readable debug reports.",
        "url": "https://butianhua4.github.io/ai-agent-debug-kit/",
        "codeRepository": "https://github.com/butianhua4/ai-agent-debug-kit",
        "image": "https://butianhua4.github.io/ai-agent-debug-kit/assets/product-preview.svg",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "AI agent log parsing",
          "Tool-call breakdown",
          "Risk flag detection",
          "Run A/B comparison",
          "Markdown report export",
          "CLI CI gates"
        ]
      }
    </script>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">AI Agent Debug Kit</p>
        <h1>Inspect agent logs before they become production incidents.</h1>
      </div>
      <div class="actions">
        <select id="sampleSelect" aria-label="Sample scenario">
          <option value="healthy">Healthy Run</option>
          <option value="toolFailure">Tool Failure</option>
          <option value="costSpike">Cost Spike</option>
          <option value="permission">Permission Issue</option>
        </select>
        <button id="loadSample" type="button">Load Demo</button>
        <label class="file-button">
          Import Log
          <input id="fileInput" type="file" accept=".json,.jsonl,.log,.txt,text/plain,application/json">
        </label>
        <button id="clearLogs" type="button">Clear</button>
        <button id="saveSnapshot" type="button">Save Snapshot</button>
        <button id="copyReport" type="button">Copy Markdown</button>
        <button id="exportReport" type="button">Export Markdown</button>
      </div>
    </header>

    <main class="workspace">
      <section class="input-pane" aria-labelledby="inputTitle">
        <div class="section-head">
          <h2 id="inputTitle">Agent Log</h2>
          <span id="lineCount">0 lines</span>
        </div>
        <div class="input-tabs" role="tablist" aria-label="Log inputs">
          <button id="singleMode" class="tab active" type="button">Single</button>
          <button id="compareMode" class="tab" type="button">Compare</button>
        </div>
        <div class="log-fields">
          <label>
            <span>Run A</span>
            <textarea id="logInput" spellcheck="false" placeholder="Paste JSONL, JSON, or plain agent logs here..."></textarea>
          </label>
          <label id="compareField" class="hidden">
            <span class="field-title">
              Run B
              <label class="mini-file-button">
                Import
                <input id="compareFileInput" type="file" accept=".json,.jsonl,.log,.txt,text/plain,application/json">
              </label>
            </span>
            <textarea id="compareInput" spellcheck="false" placeholder="Paste a second run to compare against Run A..."></textarea>
          </label>
        </div>
      </section>

      <section class="results-pane" aria-labelledby="summaryTitle">
        <div class="section-head">
          <h2 id="summaryTitle">Summary</h2>
          <span id="parseState">Waiting for input</span>
        </div>

        <div class="metrics" aria-label="Run metrics">
          <article>
            <span>Total Events</span>
            <strong id="totalEvents">0</strong>
          </article>
          <article>
            <span>Tool Calls</span>
            <strong id="toolCalls">0</strong>
          </article>
          <article>
            <span>Errors</span>
            <strong id="errors">0</strong>
          </article>
          <article>
            <span>Est. Cost</span>
            <strong id="cost">$0.0000</strong>
          </article>
        </div>

        <div class="pricing">
          <label>
            <span>Report title</span>
            <input id="reportTitle" type="text" value="AI Agent Debug Report">
          </label>
          <label>
            <span>Pricing preset</span>
            <select id="pricingPreset">
              <option value="custom">Custom</option>
              <option value="gpt5">GPT-5 style</option>
              <option value="mini">Mini model</option>
              <option value="local">Local / zero cost</option>
            </select>
          </label>
          <label>
            <span>Input $ / 1M tokens</span>
            <input id="inputPrice" type="number" min="0" step="0.01" value="1.25">
          </label>
          <label>
            <span>Output $ / 1M tokens</span>
            <input id="outputPrice" type="number" min="0" step="0.01" value="10">
          </label>
          <label class="checkbox-label">
            <span>Redact exported report</span>
            <input id="redactReport" type="checkbox" checked>
          </label>
        </div>

        <div class="analysis-grid">
          <section id="comparePanel" class="hidden">
            <h3>Run Comparison</h3>
            <div id="comparison" class="comparison"></div>
          </section>
          <section>
            <h3>Timeline</h3>
            <ol id="timeline" class="timeline"></ol>
          </section>
          <section>
            <h3>Risk Flags</h3>
            <ul id="riskFlags" class="flag-list"></ul>
          </section>
          <section>
            <h3>Tool Breakdown</h3>
            <div id="toolBreakdown" class="table"></div>
          </section>
          <section>
            <h3>Recommendations</h3>
            <ul id="recommendations" class="flag-list"></ul>
          </section>
          <section>
            <h3>Saved Snapshots</h3>
            <div id="historyList" class="history-list"></div>
          </section>
        </div>
      </section>
    </main>

    <script src="./core.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
